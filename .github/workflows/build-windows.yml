name: Build & Publish Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (defaults to current branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Windows artifacts
        run: npx electron-builder --win

      - name: Upload artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          # Create the release if it doesn't already exist (tag push case).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG"
          # Attach all Windows binaries + updater metadata to the release.
          gh release upload "$TAG" \
            dist/*.exe \
            dist/*.exe.blockmap \
            dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
